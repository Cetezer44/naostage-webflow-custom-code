<style>
  .partners-block {
    overflow: hidden;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  .partners-block.is-dragging { cursor: grabbing; }

  .partners-block .flex-partenaires {
    display: flex;
    flex-wrap: nowrap;
    gap: 64px;            /* ajuste l'espacement entre logos ici */
    width: max-content;
    align-items: center;
    will-change: transform;
  }
  .partners-block .w-dyn-item { flex: 0 0 auto; user-select: none; }
  .partners-block img {
    pointer-events: none;
    -webkit-user-drag: none;
  }
</style>

<script>
(() => {
  const init = () => {
    const wrapper = document.querySelector('.partners-block');
    const list    = wrapper && wrapper.querySelector('.flex-partenaires');
    if (!wrapper || !list) return;

    // 1) Items originaux
    const originals = [...list.children].filter(c => !c.hasAttribute('data-marquee-clone'));
    if (!originals.length) return;
    originals.forEach(it => {
      it.querySelectorAll('img').forEach(img => img.draggable = false);
      it.querySelectorAll('a').forEach(a => a.addEventListener('dragstart', e => e.preventDefault()));
    });

    // 2) Dupliquer assez de sets pour que la piste fasse > 2x la viewport
    const viewportW = wrapper.offsetWidth;
    const cloneSet = () => originals.forEach(orig => {
      const clone = orig.cloneNode(true);
      clone.setAttribute('data-marquee-clone', '1');
      clone.setAttribute('aria-hidden', 'true');
      clone.querySelectorAll('img').forEach(img => img.draggable = false);
      list.appendChild(clone);
    });
    cloneSet();
    let safety = 0;
    while (list.scrollWidth < viewportW * 2 && safety++ < 6) cloneSet();

    // 3) Largeur d'un set = position du premier clone
    let setWidth = list.querySelector('[data-marquee-clone="1"]').offsetLeft;

    const state = {
      offset: 0,
      speed: 50,           // px/s — ajuste pour vitesse auto-scroll
      lastTs: null,
      dragging: false,
      pointerId: null,
      startX: 0,
      startOffset: 0,
      lastMoveX: 0,
      lastMoveTs: 0,
      velocity: 0,
      inertia: 0,
      paused: false,
      raf: 0
    };

    const apply = () => {
      let o = state.offset % setWidth;
      if (o > 0) o -= setWidth;
      list.style.transform = `translate3d(${o}px,0,0)`;
    };

    const tick = (ts) => {
      if (state.lastTs == null) state.lastTs = ts;
      const dt = (ts - state.lastTs) / 1000;
      state.lastTs = ts;
      if (!state.dragging && !state.paused) {
        let v = -state.speed;
        if (Math.abs(state.inertia) > 1) {
          v = state.inertia;
          state.inertia *= Math.pow(0.94, dt * 60);
          if (Math.abs(state.inertia) < state.speed) state.inertia = 0;
        }
        state.offset += v * dt;
        apply();
      }
      state.raf = requestAnimationFrame(tick);
    };

    const onDown = (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      state.dragging   = true;
      state.pointerId  = e.pointerId;
      state.startX     = e.clientX;
      state.startOffset = state.offset;
      state.lastMoveX  = e.clientX;
      state.lastMoveTs = performance.now();
      state.velocity   = 0;
      wrapper.classList.add('is-dragging');
      try { wrapper.setPointerCapture(e.pointerId); } catch(_) {}
    };
    const onMove = (e) => {
      if (!state.dragging || e.pointerId !== state.pointerId) return;
      const dx = e.clientX - state.startX;
      state.offset = state.startOffset + dx;
      apply();
      const now = performance.now();
      const ddt = (now - state.lastMoveTs) / 1000;
      if (ddt > 0) state.velocity = (e.clientX - state.lastMoveX) / ddt;
      state.lastMoveX = e.clientX;
      state.lastMoveTs = now;
    };
    const onUp = (e) => {
      if (!state.dragging) return;
      state.dragging = false;
      state.inertia = state.velocity;
      wrapper.classList.remove('is-dragging');
      try { wrapper.releasePointerCapture(e.pointerId); } catch(_) {}
    };

    wrapper.addEventListener('pointerdown',   onDown);
    wrapper.addEventListener('pointermove',   onMove);
    wrapper.addEventListener('pointerup',     onUp);
    wrapper.addEventListener('pointercancel', onUp);

    // Pause hors viewport
    new IntersectionObserver((entries) => {
      entries.forEach(en => state.paused = !en.isIntersecting);
    }, { threshold: 0 }).observe(wrapper);

    // Recalcul largeur sur resize
    let rt;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => {
        const fc = list.querySelector('[data-marquee-clone="1"]');
        if (fc) setWidth = fc.offsetLeft;
      }, 150);
    });

    state.raf = requestAnimationFrame(tick);
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
